name: Update WAProto

on:
  schedule:
    - cron: "10 1 * * *"   # roda diariamente às 01:10 UTC
  workflow_dispatch: {}     # também permite rodar manualmente

permissions:
  contents: write
  pull-requests: write

jobs:
  update-proto:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'yarn'

      # Garante Yarn clássico (v1) no runner
      - name: Install Yarn v1
        run: npm i -g yarn@1.22.22

      # Instala as deps do projeto raiz (lockfile v1)
      - name: Install packages (root)
        run: yarn --pure-lockfile

      # Instala as deps do subprojeto proto-extract (lockfile v1)
      - name: Install packages (proto-extract)
        run: yarn --cwd proto-extract --pure-lockfile

      # Extrai versão/URL a partir do script do proto-extract
      - name: Update WAProto.proto
        id: wa_proto_info
        run: |
          yarn --cwd proto-extract start > wa-logs.txt
          WA_VERSION=$(perl -n -e'/Current version\: (.+)/ && print $1' wa-logs.txt)
          WA_JS_URL=$(perl -n -e'/Found source JS URL\: (.+)/ && print $1' wa-logs.txt)
          echo "wa_version=$WA_VERSION" >> $GITHUB_OUTPUT
          echo "wa_js_url=$WA_JS_URL" >> $GITHUB_OUTPUT

      # Gera estáticos (pbjs/pbts)
      - name: Generate statics
        run: yarn gen:protobuf

      # Atualiza o JSON de versão
      - name: Update baileys-version.json
        run: |
          WA_VERSION="${{steps.wa_proto_info.outputs.wa_version}}"
          WA_NUMBERS=$(echo "$WA_VERSION" | sed 's/\./, /g')
          printf '{\n\t"version": [%s]\n}\n' "$WA_NUMBERS" > src/Defaults/baileys-version.json

      # Abre PR com as mudanças
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: updated proto/version to v${{steps.wa_proto_info.outputs.wa_version}}"
          title: "Whatsapp v${{steps.wa_proto_info.outputs.wa_version}} proto/version change"
          branch: "update-proto/stable"
          delete-branch: true
          labels: "update-proto"
          body: |
            Automated changes
            Found source JS URL: ${{steps.wa_proto_info.outputs.wa_js_url}}
            Current version: v${{steps.wa_proto_info.outputs.wa_version}}
          add-paths: |
            WAProto/*
            src/Defaults/baileys-version.json
