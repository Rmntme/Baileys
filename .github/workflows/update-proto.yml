name: Update WAProto

on:
  schedule:
    - cron: "10 1 * * *"   # roda diariamente 01:10 UTC
  workflow_dispatch: {}     # permite rodar manualmente

permissions:
  contents: write
  pull-requests: write

jobs:
  update-proto:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      # =========================
      # ROOT (usa Yarn v1 clássico)
      # =========================
      - name: Install Yarn v1 (root)
        run: npm i -g yarn@1.22.22

      - name: Install packages (root)
        run: |
          yarn
          # compila se existir tsc no script/postinstall (ignora se não houver)
          yarn -s run tsc || true

      # ============================================
      # proto-extract (lockfile Berry: v2/v3/v4)
      # Força Yarn Berry via Corepack nesse diretório
      # ============================================
      - name: Enable Corepack
        run: corepack enable

      - name: Prepare Yarn (Berry) globally
        run: corepack prepare yarn@stable --activate

      - name: Set Yarn Berry inside proto-extract
        run: |
          cd proto-extract
          corepack yarn set version stable
          corepack yarn -v

      - name: Install packages (proto-extract with Berry)
        run: |
          corepack yarn --cwd proto-extract install --immutable || \
          corepack yarn --cwd proto-extract install

      # =========================
      # Atualiza / Gera artefatos
      # =========================
      - name: Update WAProto.proto
        id: wa_proto_info
        run: |
          corepack yarn --cwd proto-extract start > wa-logs.txt
          WA_VERSION=$(cat wa-logs.txt | perl -n -e'/Current version\: (.+)/ && print $1')
          WA_JS_URL=$(cat wa-logs.txt | perl -n -e'/Found source JS URL\: (.+)/ && print $1')
          echo "wa_version=$WA_VERSION" >> $GITHUB_OUTPUT
          echo "wa_js_url=$WA_JS_URL" >> $GITHUB_OUTPUT

      - name: Generate statics
        run: yarn gen:protobuf

      - name: Update baileys-version.json
        run: |
          WA_VERSION="${{steps.wa_proto_info.outputs.wa_version}}"
          WA_NUMBERS=$(echo $WA_VERSION | sed "s/\./, /g")
          echo -e "{\n\t\"version\": [$WA_NUMBERS]\n}" > src/Defaults/baileys-version.json

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: updated proto/version to v${{steps.wa_proto_info.outputs.wa_version}}"
          title: "Whatsapp v${{steps.wa_proto_info.outputs.wa_version}} proto/version change"
          branch: "update-proto/stable"
          delete-branch: true
          labels: "update-proto"
          body: |
            Automated changes
            Found source JS URL: ${{steps.wa_proto_info.outputs.wa_js_url}}
            Current version: v${{steps.wa_proto_info.outputs.wa_version}}
          add-paths: |
            WAProto/*
            src/Defaults/baileys-version.json
