name: Fix proto-extract yarn.lock

on:
  workflow_dispatch: {}   # só roda quando você clicar "Run workflow"

permissions:
  contents: write

jobs:
  fix-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Yarn v1
        run: npm i -g yarn@1.22.22

      - name: Generate yarn.lock (Yarn v1) in proto-extract
        run: |
          cd proto-extract
          yarn install

      - name: Commit new yarn.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proto-extract/yarn.lock
          git commit -m "chore(proto-extract): regenerate yarn.lock with Yarn v1"
          git push
